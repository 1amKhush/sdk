name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-bookworm
        env:
          POSTGRES_PASSWORD: contextvm-test
          POSTGRES_DB: contextvm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contextvm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        env:
          NODE_ENV: test
          PAYMENT_TEST_DATABASE_URL: postgres://postgres:contextvm-test@127.0.0.1:5432/contextvm_test
        run: bun test --concurrent --timeout=60000
